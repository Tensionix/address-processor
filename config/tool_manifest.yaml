  - id: run_address_aligner
    # English and Russian final command title.
    # Английское и русское название финальной команды.
    title: "Address alignment"
    title_ru: "Сопоставление адресов"
    # English and Russian final command description.
    # Английское и русское описание финальной команды.
    description: "Choose columns in the GUI without editing project.yaml. Empty fields keep automatic behavior."
    description_ru: "Выбрать колонки в интерфейсе без правки project.yaml. Пустые поля включают авто-режим."
    # Runtime fields passed to context.operation.parameters.
    # Runtime-поля, которые передаются в context.operation.parameters.
    fields:
      - id: ground_truth_column
        type: "text"
        group: "columns"
        label: "GT column"
        label_ru: "Колонка GT"
        default: ""
        placeholder: "B"
        hint: "Reference address column. Empty means automatic detection."
        hint_ru: "Эталонная адресная колонка. Пусто = определить автоматически."
      - id: ground_truth_column_header
        type: "select"
        group: "columns"
        label: "GT header"
        label_ru: "Название колонки GT"
        default: ""
        hint: "Scans the first row of the first input workbook. Manual letter/number above has priority."
        hint_ru: "Сканирует первую строку первой книги input. Ручная буква/номер выше имеет приоритет."
        options_source: "system_core.services.address_aligner_service:input_column_options"
        cache_seconds: 10
      - id: target_columns
        type: "text"
        group: "columns"
        label: "Address columns"
        label_ru: "Адресные колонки"
        default: ""
        placeholder: "C или C,D,AC"
        hint: "One column or several columns separated by commas."
        hint_ru: "Одна колонка или несколько через запятую."
      - id: target_column_header
        type: "select"
        group: "columns"
        label: "Address header"
        label_ru: "Название адресной колонки"
        default: ""
        hint: "Optional single target column selected by first-row header. Manual address columns above have priority."
        hint_ru: "Необязательный выбор одной целевой колонки по заголовку первой строки. Ручные адресные колонки выше имеют приоритет."
        options_source: "system_core.services.address_aligner_service:input_column_options"
        cache_seconds: 10
      - id: alignment_mode
        type: "radio"
        group: "alignment_mode"
        label: "Alignment mode"
        label_ru: "Режим сопоставления"
        default: "fast"
        hint: "Fast keeps the legacy matcher intact. Normalized first runs the same matcher, then cleans aligned address columns."
        hint_ru: "Быстрый режим сохраняет прежний matcher. Нормализованный сначала сопоставляет так же, затем чистит выровненные адресные колонки."
        options:
          - value: "fast"
            label: "Fast alignment"
            label_ru: "Быстрое сопоставление"
          - value: "normalized"
            label: "Alignment + normalization"
            label_ru: "Сопоставление + нормализация"
      - id: companion_mode
        type: "radio"
        group: "related_columns"
        label: "Linked columns"
        label_ru: "Связанные колонки"
        default: "auto"
        hint: "Values from linked columns move together with the matched raw address."
        hint_ru: "Значения из связанных колонок едут вместе с найденным сырым адресом."
        options:
          - value: "auto"
            label: "Auto"
            label_ru: "Авто"
          - value: "none"
            label: "None"
            label_ru: "Нет"
          - value: "left"
            label: "Left of each address"
            label_ru: "Слева"
          - value: "right"
            label: "Right of each address"
            label_ru: "Справа"
          - value: "between"
            label: "Between GT and address"
            label_ru: "Блок между GT и адресом"
      - id: satellite_columns
        type: "text"
        group: "related_columns"
        label: "Satellite columns"
        label_ru: "Колонки-сателлиты"
        default: ""
        placeholder: "C=D:E; F=G,H"
        hint: "Optional explicit map: address column = one or more linked non-address columns. Use ranges and semicolon between groups."
        hint_ru: "Необязательная явная карта: адресная колонка = связанные неадресные колонки. Диапазоны через :, группы через ;."
      - id: normalize_before_match
        type: "checkbox"
        group: "alignment_normalization"
        advanced: true
        gui_hidden: true
        label: "Normalize before match"
        label_ru: "Нормализовать перед сопоставлением"
        default: false
        hint: "Optional slower mode: use the common AddressNormalizer before the legacy five-stage matcher."
        hint_ru: "Необязательный более медленный режим: использовать общий AddressNormalizer перед старым пятиэтапным сопоставителем."
      - id: normalize_after_match
        type: "checkbox"
        group: "alignment_normalization"
        advanced: true
        gui_hidden: true
        label: "Normalize after match"
        label_ru: "Нормализовать после сопоставления"
        default: false
        hint: "Compatibility flag for scripts. In the GUI prefer the Alignment + normalization mode above."
        hint_ru: "Флаг совместимости для скриптов. В GUI лучше выбирать режим Сопоставление + нормализация выше."
      - id: collect_before_match
        type: "checkbox"
        group: "alignment_normalization"
        advanced: true
        gui_hidden: true
        label: "Collect before match"
        label_ru: "Собрать перед сопоставлением"
        default: false
        hint: "Build clean address candidates from selected columns before matching them to the reference column."
        hint_ru: "Собрать чистые адресные кандидаты из выбранных колонок перед сопоставлением с эталоном."
      - id: collect_whole_document
        type: "checkbox"
        group: "alignment_normalization"
        advanced: true
        gui_hidden: true
        label: "Whole document"
        label_ru: "Весь документ / все страницы"
        default: false
        hint: "When collection before match is enabled, scan the whole workbook/document instead of only selected address columns."
        hint_ru: "При сборке перед сопоставлением сканировать всю книгу/документ, а не только выбранные адресные колонки."
      - id: use_oktmo
        type: "checkbox"
        group: "alignment_normalization"
        label: "Enable OKTMO keys"
        label_ru: "Подключить ключи ОКТМО"
        default: true
        hint: "Uses the local Rosstat registry and the project keys prepared in the OKTMO child screen. If the key file is empty, OKTMO does not narrow the search."
        hint_ru: "Использует локальный реестр Росстата и проектные ключи из экрана ОКТМО. Если файл ключей пустой, ОКТМО не сужает поиск."
      - id: city
        type: "text"
        group: "alignment_normalization"
        advanced: true
        gui_hidden: true
        label: "Default city"
        label_ru: "Город по умолчанию"
        default: ""
        placeholder: "Тюмень"
        hint: "Optional city name removed from component keys during normalized matching."
        hint_ru: "Необязательное название города, которое убирается из ключей компонентов при нормализованном сопоставлении."
    # Python function called by the operation.
    # Python-функция, которая будет вызвана при запуске операции.
    service: "system_core.services.address_aligner_service:run_address_aligner"
    # safe = operation starts without a danger confirmation.
    # safe = операция не считается опасной и запускается без подтверждения.
    kind: "safe"

