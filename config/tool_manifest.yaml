  - id: oktmo_tools
    title: "OKTMO"
    title_ru: "ОКТМО / ключи проекта"
    description: "Prepare project OKTMO focus keys, pins and Rosstat registry data outside the working address screens."
    description_ru: "Подготовить проектные ключи фокусировки ОКТМО, пины и реестр Росстата отдельно от рабочих адресных экранов."
    auto_open_child: "oktmo_key_console"
    children:
      - id: oktmo_key_console
        title: "Project OKTMO keys"
        title_ru: "Ключи и область ОКТМО"
        description: "Choose a region/municipality, search exact settlements, and maintain the current OKTMO key file."
        description_ru: "Выбрать регион/муниципалитет, найти точные населённые пункты и вести текущий файл ключей ОКТМО."
        fields:
          - id: oktmo_scope_region
            type: "select"
            group: "territory"
            label: "OKTMO search region"
            label_ru: "Регион ОКТМО"
            default: ""
            placeholder: "Тюменская область"
            searchable: true
            refresh_on_change: true
            options_source: "system_core.services.address_aligner_service:oktmo_region_scope_options"
            cache_seconds: 3600
            hint: "Region list is read from the local Rosstat OKTMO snapshot."
            hint_ru: "Список регионов читается из локального снимка ОКТМО Росстата."
          - id: oktmo_scope_municipality
            type: "select"
            group: "territory"
            label: "OKTMO municipality"
            label_ru: "Муниципалитет ОКТМО"
            default: ""
            placeholder: "городской округ, муниципальный округ или район"
            searchable: true
            depends_on: ["oktmo_scope_region"]
            options_source: "system_core.services.address_aligner_service:oktmo_municipality_scope_options"
            cache_seconds: 0
            hint: "Municipality list is built inside the selected region. Press + in the field to add the whole municipality and its settlements to the key file."
            hint_ru: "Список строится внутри выбранного региона. Нажмите + в поле, чтобы добавить всё МО и его населённые пункты в файл ключей."
          - id: oktmo_key_toolbar
            type: "oktmo_key_toolbar"
            group: "territory"
            ui_only: true
            label: "OKTMO search keys"
            label_ru: "Ключи ОКТМО"
            hint: "Current keys are reused by address collection, alignment and reference workflows when OKTMO is enabled there."
            hint_ru: "Текущие ключи используются сбором, сопоставлением и эталонными режимами, когда там включён ОКТМО."
          - id: oktmo_data_dir
            type: "text"
            group: "source"
            advanced: true
            label: "OKTMO data folder"
            label_ru: "Папка данных ОКТМО"
            default: ""
            placeholder: "data"
            hint: "Folder containing rosstat/data-*.csv. Empty means the project data folder."
            hint_ru: "Папка, где есть rosstat/data-*.csv. Пусто = папка data проекта."
        service: "system_core.services.address_aligner_service:oktmo_key_console"
        kind: "safe"

      - id: update_rosstat_oktmo
        title: "Update Rosstat OKTMO"
        title_ru: "Обновить ОКТМО Росстата"
        description: "Download the latest Rosstat OKTMO data-*.csv snapshot into data/rosstat for address normalization."
        description_ru: "Скачать свежий снимок Росстата data-*.csv в data/rosstat для нормализации адресов."
        gui_hidden: true
        fields:
          - id: rosstat_oktmo_url
            type: "text"
            group: "source"
            label: "Rosstat OKTMO URL"
            label_ru: "URL ОКТМО Росстата"
            default: "https://rosstat.gov.ru/opendata/7708234640-oktmo/"
            hint: "Use the dataset page or a direct data-*.csv URL. After a successful update, old data-*.csv snapshots are removed and only the fresh file remains."
            hint_ru: "Можно указать страницу набора или прямую ссылку data-*.csv. После успешного обновления старые снимки data-*.csv удаляются, остаётся только свежий файл."
          - id: oktmo_data_dir
            type: "text"
            group: "source"
            advanced: true
            label: "OKTMO data folder"
            label_ru: "Папка данных ОКТМО"
            default: ""
            placeholder: "data"
            hint: "Folder containing rosstat/data-*.csv. Empty means the project data folder."
            hint_ru: "Папка, где есть rosstat/data-*.csv. Пусто = папка data проекта."
        service: "system_core.services.address_aligner_service:update_rosstat_oktmo_data"
        kind: "safe"

  - id: convert_legacy_office_sources
    # English and Russian final command title.
    # Английское и русское название финальной команды.
    title: "Convert DOC/XLS"
    title_ru: "Конвертация DOC/XLS"
    # English and Russian final command description.
    # Английское и русское описание финальной команды.
    description: "Convert old .doc/.xls files in input to .docx/.xlsx, then delete Office temp files and same-name old/PDF/TXT/CSV/MD duplicates."
    description_ru: "Преобразовать старые .doc/.xls из input в .docx/.xlsx, затем удалить временный мусор Office и одноимённые старые/PDF/TXT/CSV/MD дубли."
    fields:
      - id: overwrite_existing
        type: "checkbox"
        group: "options"
        label: "Overwrite existing"
        label_ru: "Перезаписывать существующие"
        default: false
        hint: "When off, existing .docx/.xlsx files are preserved; same-name old/PDF/TXT/CSV/MD duplicates are still removed."
        hint_ru: "Если выключено, существующие .docx/.xlsx сохраняются; одноимённые старые/PDF/TXT/CSV/MD дубли всё равно удаляются."
    # Python function called by the operation.
    # Python-функция, которая будет вызвана при запуске операции.
    service: "system_core.services.address_aligner_service:convert_legacy_office_sources"
