# Tool description for the GUI and service shell.
# Описание инструмента для GUI и сервисной оболочки.
tool:
  # Internal project identifier.
  # Внутренний идентификатор проекта.
  id: audion_address_aligner
  # Display name shown in the interface.
  # Название, которое отображается в интерфейсе.
  name: "Audion Address Processor"
  # Tool category.
  # Категория инструмента.
  category: "Address Processing"
  # Tool/configuration version.
  # Версия конфигурации/инструмента.
  version: "1.0.0"

# Project-managed folders.
# Управляемые папки проекта.
paths:
  # Input Excel files.
  # Входные Excel-файлы.
  input: "input"
  # Generated results.
  # Готовые результаты.
  output: "output"
  # Operation logs.
  # Журналы операций.
  logs: "logs"
  # Diagnostic reports.
  # Диагностические отчеты.
  report: "report"
  # Workspace for intermediate files.
  # Рабочая папка для промежуточных файлов.
  workspace: "workspace"
  # Configuration files.
  # Конфигурационные файлы.
  config: "config"
  # Archives and release artifacts.
  # Архивы и релизные артефакты.
  release: "release"

# GUI startup settings.
# Настройки запуска GUI.
ui:
  # Window/page title.
  # Заголовок окна/страницы.
  title: "Audion Address Processor"
  # Local GUI host.
  # Локальный адрес GUI.
  host: "127.0.0.1"
  # GUI port.
  # Порт GUI.
  port: 8080
  # true = run as a native window, false = regular web UI.
  # true = запускать как native-окно, false = обычный web-интерфейс.
  native: false
  # true = reload GUI on code changes; portable builds usually keep this false.
  # true = перезагружать GUI при изменениях кода; для portable-сборки обычно false.
  reload: false
  # true = open browser when GUI starts.
  # true = открывать браузер при запуске GUI.
  open_browser: true

# Main operations shown in the GUI.
# Основные операции, отображаемые в GUI.
operations:
  - id: run_address_aligner
    # English and Russian button title.
    # Английское и русское название кнопки.
    title: "Run address aligner"
    title_ru: "Выровнять адреса"
    # English and Russian operation description.
    # Английское и русское описание операции.
    description: "Process .xlsx files from input and write aligned workbooks to output."
    description_ru: "Обработать .xlsx-файлы из исходников и записать выровненные книги в результаты."
    # Python function called by the operation.
    # Python-функция, которая будет вызвана при запуске операции.
    service: "system_core.services.address_aligner_service:run_address_aligner"
    # safe = operation starts without a danger confirmation.
    # safe = операция не считается опасной и запускается без подтверждения.
    kind: "safe"

  - id: run_parser_diagnostic
    # English and Russian button title.
    # Английское и русское название кнопки.
    title: "Run parser diagnostic"
    title_ru: "Диагностика"
    # English and Russian operation description.
    # Английское и русское описание операции.
    description: "Extract parsed address components from input files for inspection."
    description_ru: "Извлечь компоненты адресов из исходных файлов для проверки парсера."
    # Python function called by the operation.
    # Python-функция, которая будет вызвана при запуске операции.
    service: "system_core.services.address_aligner_service:run_parser_diagnostic"
    # safe = operation starts without a danger confirmation.
    # safe = операция не считается опасной и запускается без подтверждения.
    kind: "safe"

  - id: validate_input
    # English and Russian button title.
    # Английское и русское название кнопки.
    title: "Validate input"
    title_ru: "Проверить исходники"
    # English and Russian operation description.
    # Английское и русское описание операции.
    description: "Check the input folder and list supported spreadsheets."
    description_ru: "Проверить исходные файлы и показать найденные таблицы."
    # Python function called by the operation.
    # Python-функция, которая будет вызвана при запуске операции.
    service: "system_core.services.address_aligner_service:validate_input"
    # safe = operation starts without a danger confirmation.
    # safe = операция не считается опасной и запускается без подтверждения.
    kind: "safe"

# Command-tree operations shown in the GUI when present.
# Операции дерева команд GUI, если этот раздел присутствует.
operation_groups:
  - id: run_table_comparison
    title: "Compare tables A and B"
    title_ru: "СРАВНИТЬ ДВЕ ТАБЛИЦЫ"
    description: "Choose any two workbooks, assemble each address from its configured columns, normalize and match buildings, and create a separate comparison workbook."
    description_ru: "Выбрать любые две книги, собрать адреса из указанных колонок, нормализовать и сопоставить дома, затем создать отдельную книгу сравнения."
    service: "system_core.services.address_aligner_service:run_table_comparison"
    kind: "safe"
    fields:
      - id: file_a
        type: "xlsx_file_picker"
        group: "files"
        label: "Table A"
        label_ru: "Таблица A"
        default: ""
        hint: "Choose the first Excel workbook from any folder."
        hint_ru: "Выберите первую книгу Excel в любой папке. Переносить её в input не нужно."
        refresh_on_change: true
      - id: file_b
        type: "xlsx_file_picker"
        group: "files"
        label: "Table B"
        label_ru: "Таблица B"
        default: ""
        hint: "Choose the second Excel workbook from any folder."
        hint_ru: "Выберите вторую книгу Excel в любой папке. Переносить её в input не нужно."
        refresh_on_change: true
      - id: sheet_a
        type: "select"
        group: "sheets"
        label: "Worksheet A"
        label_ru: "Лист A"
        default: ""
        depends_on: ["file_a"]
        options_source: "system_core.services.address_aligner_service:comparison_sheet_a_options"
        cache_seconds: 3
      - id: sheet_b
        type: "select"
        group: "sheets"
        label: "Worksheet B"
        label_ru: "Лист B"
        default: ""
        depends_on: ["file_b"]
        options_source: "system_core.services.address_aligner_service:comparison_sheet_b_options"
        cache_seconds: 3
      - id: address_columns_a
        type: "text"
        group: "addresses"
        label: "Address columns A"
        label_ru: "Адресные колонки A"
        default: ""
        placeholder: "B или B,C,D"
        hint: "Empty = auto-detect. Or enter one column/several address slots in assembly order."
        hint_ru: "Пусто = автопоиск. Или укажите одну колонку/несколько слотов в порядке сборки."
      - id: address_columns_b
        type: "text"
        group: "addresses"
        label: "Address columns B"
        label_ru: "Адресные колонки B"
        default: ""
        placeholder: "F или F,H,J"
        hint: "Empty = auto-detect. Columns may be in different positions than in A."
        hint_ru: "Пусто = автопоиск. Колонки могут стоять не там, где в A."
      - id: start_row_a
        type: "number"
        group: "rows"
        label: "First data row A"
        label_ru: "Первая строка данных A"
        default: 5
      - id: start_row_b
        type: "number"
        group: "rows"
        label: "First data row B"
        label_ru: "Первая строка данных B"
        default: 7
      - id: sort_addresses
        type: "checkbox"
        group: "options"
        label: "Sort addresses within groups"
        label_ru: "Сортировать адреса внутри групп"
        default: false
        hint: "Off: matched rows first in A order, then only A and only B. On: the same three groups are additionally sorted by normalized address."
        hint_ru: "Выкл.: сначала сопоставленные в порядке A, затем только A и только B. Вкл.: те же три группы дополнительно сортируются по нормализованному адресу."

  - id: run_safe_table_join
    title: "Safe two-table join"
    title_ru: "ПЕРЕНЕСТИ КОЛОНКИ ПО АДРЕСУ"
    description: "Copy the primary XLSX intact and append data matched by a normalized building address. Formulas, formatting, sheets, and row order in the primary workbook are preserved through Excel automation."
    description_ru: "Найти одинаковые дома в двух книгах и перенести выбранные колонки из источника в соответствующие строки основной таблицы. Простое копирование строк для этого не подходит; оформление, формулы и порядок основной книги сохраняются."
    service: "system_core.services.address_aligner_service:run_safe_table_join"
    kind: "safe"
    fields:
      - id: primary_file
        type: "xlsx_file_picker"
        group: "files"
        label: "Primary workbook"
        label_ru: "Куда переносим данные"
        default: ""
        hint: "The workbook is copied to output and is never overwritten."
        hint_ru: "Выберите книгу, которую нужно дополнить. Оригинал не изменится — результат будет отдельным файлом в output."
        refresh_on_change: true
      - id: source_file
        type: "xlsx_file_picker"
        group: "files"
        label: "Source workbook"
        label_ru: "Откуда переносим данные"
        default: ""
        hint: "Read-only source of fields to append."
        hint_ru: "Выберите книгу, из которой нужно перенести данные. Оригинал открывается только для чтения."
        refresh_on_change: true
      - id: primary_sheet
        type: "select"
        group: "sheets"
        label: "Primary sheet"
        label_ru: "Основной лист"
        default: ""
        depends_on: ["primary_file"]
        options_source: "system_core.services.address_aligner_service:safe_join_primary_sheet_options"
        cache_seconds: 0
      - id: source_sheets
        type: "checkboxes"
        group: "sheets"
        label: "Source sheets"
        label_ru: "Листы источника"
        hint: "Select one or more sheets. Only checked sheets are read."
        hint_ru: "Отметьте один или несколько листов. Читаются только включённые."
        depends_on: ["source_file"]
        options_source: "system_core.services.address_aligner_service:safe_join_source_sheet_options"
        cache_seconds: 0
      - id: primary_address_columns
        type: "text"
        group: "columns"
        label: "Primary address columns"
        label_ru: "Адрес в основной"
        default: "B,C,D"
        hint_ru: "Улица, дом, корпус/литера."
      - id: source_address_columns
        type: "text"
        group: "columns"
        label: "Source address columns"
        label_ru: "Адрес в источнике"
        default: "B,C"
        hint_ru: "Улица и дом. Квартира/комната игнорируются в ключе дома."
      - id: source_payload_columns
        type: "text"
        group: "columns"
        label: "Fields to append"
        label_ru: "Какие колонки перенести"
        default: "D,E,F,G,H,I,J,K"
        hint_ru: "Колонки источника, значения которых нужно поставить в строки с тем же адресом дома."
      - id: primary_start_row
        type: "number"
        group: "rows"
        label: "First primary data row"
        label_ru: "Первая строка основных данных"
        default: 5
      - id: source_start_row
        type: "number"
        group: "rows"
        label: "First source data row"
        label_ru: "Первая строка данных источника"
        default: 7
      - id: output_header_row
        type: "number"
        group: "rows"
        label: "Output header row"
        label_ru: "Строка заголовков результата"
        default: 1

  - id: run_address_collection
    title: "Address collection"
    title_ru: "СБОР АДРЕСОВ"
    description: "Collect address candidates recursively from XLSX/DOCX/ODT/TXT/CSV/MD/searchable PDF, merge slot evidence, sanitize incomplete rows, and write an address collection workbook."
    description_ru: "Рекурсивно собрать адреса из XLSX/DOCX/ODT/TXT/CSV/MD/searchable PDF, объединить слот-доказательства, убрать неполные строки и записать книгу адресов."
    fields:
      - id: address_collection_action
        type: "radio"
        group: "parameters"
        label: "Action"
        label_ru: "Действие"
        default: "generate"
        refresh_on_change: true
        hint: "Create a new table, or append collected addresses to the ready workbook from the address table folder."
        hint_ru: "Собрать новую таблицу или перенести новые адреса в выбранную готовую книгу."
        options:
          - value: "generate"
            label: "New table"
            label_ru: "Собрать новую таблицу"
          - value: "update"
            label: "Append to ready"
            label_ru: "Добавить адреса в готовую"
      - id: use_oktmo
        type: "checkbox"
        group: "parameters"
        label: "Enable OKTMO keys"
        label_ru: "Подключить ключи ОКТМО"
        default: true
        hint: "Uses the local Rosstat registry and the project keys prepared in the OKTMO child screen. If the key file is empty, OKTMO does not narrow the search."
        hint_ru: "Использует локальный реестр Росстата и проектные ключи из экрана ОКТМО. Если файл ключей пустой, ОКТМО не сужает поиск."
      - id: reference_file
        type: "xlsx_file_picker"
        group: "parameters"
        label: "Ready table"
        label_ru: "Таблица, которую нужно дополнить"
        default: ""
        show_when: {address_collection_action: "update"}
        placeholder: "address_collection\\AddressCollection.xlsx"
        hint: "Optional ready XLSX. Picker fills this path; empty means latest XLSX from the address table folder, or a new table if none exists."
        hint_ru: "Выберите готовую книгу, которую нужно дополнить. Оригинал не перезаписывается."
      - id: collected_file
        type: "xlsx_file_picker"
        group: "parameters"
        label: "Collected workbook"
        label_ru: "Таблица с новыми адресами"
        default: ""
        show_when: {address_collection_action: "update"}
        placeholder: "address_collection\\AddressCollection_20260606_120000.xlsx"
        hint: "For append mode: clean XLSX produced by New table. Empty means latest AddressCollection*.xlsx from the address table folder, excluding the ready target workbook."
        hint_ru: "Выберите книгу, из которой нужно взять новые собранные адреса."
      - id: source_root
        type: "text"
        group: "source"
        label: "Source folder"
        label_ru: "Папка источников"
        default: ""
        placeholder: "input\\Тюмень образование"
        hint: "Optional recursive source folder. Empty means the whole input folder."
        hint_ru: "Необязательная рекурсивная папка источников. Пусто = вся папка input."
      - id: address_collection_dir
        type: "text"
        group: "source"
        label: "Address table folder"
        label_ru: "Папка адресной таблицы"
        default: "address_collection"
        advanced: true
        placeholder: "address_collection"
        hint: "Folder with the ready XLSX address table. If no XLSX exists there, a new table is created."
        hint_ru: "Папка с готовой XLSX-таблицей адресов. Если XLSX там нет, будет создана новая таблица."
      - id: source_columns
        type: "text"
        group: "columns"
        label: "Address columns"
        label_ru: "Адресные колонки"
        default: ""
        placeholder: "B или B,D"
        hint: "Optional XLSX columns to scan. Empty means all cells and all supported text blocks."
        hint_ru: "Необязательные XLSX-колонки для сканирования. Пусто = все ячейки и все поддержанные текстовые блоки."
      - id: collected_column
        type: "text"
        group: "columns"
        label: "Collected address column"
        label_ru: "Взять адрес из колонки"
        default: "A"
        show_when: {address_collection_action: "update"}
        placeholder: "A или 2"
        hint: "For append mode: column with the clean collected address line. Header, letter, or number are accepted."
        hint_ru: "Колонка, из которой читать новый адрес. Можно указать заголовок, букву Excel или номер."
      - id: target_column
        type: "text"
        group: "columns"
        label: "Target address column"
        label_ru: "Записать адрес в колонку"
        default: "A"
        show_when: {address_collection_action: "update"}
        placeholder: "A или 2"
        hint: "Column to append collected addresses to. Letter/number has priority over the dropdown."
        hint_ru: "Колонка готовой таблицы, куда добавлять адреса. Буква/номер главнее выбора по заголовку."
      - id: target_column_header
        type: "select"
        group: "columns"
        label: "Target address header"
        label_ru: "Название адресного столбца"
        default: ""
        show_when: {address_collection_action: "update"}
        hint: "Scans the first row of the latest workbook in address_collection. Manual letter/number above has priority."
        hint_ru: "Сканирует первую строку последней книги в address_collection. Ручная буква/номер выше имеет приоритет."
        options_source: "system_core.services.address_aligner_service:address_collection_column_options"
        cache_seconds: 10
      - id: benchmark_file
        type: "xlsx_file_picker"
        group: "columns"
        label: "Benchmark workbook"
        label_ru: "Книга-бенчмарк"
        default: ""
        placeholder: "input\\benchmark\\control_addresses.xlsx"
        hint: "Optional XLSX with the control address column. It is used only for coverage measurement, not as an input source."
        hint_ru: "Необязательный XLSX с контрольной адресной колонкой. Используется только для оценки покрытия, не как источник сборки."
      - id: benchmark_column
        type: "text"
        group: "columns"
        label: "Benchmark column"
        label_ru: "Столбец бенчмарка"
        default: "Местоположение"
        placeholder: "Местоположение"
        hint: "Header, letter, or number of the control address column."
        hint_ru: "Название, буква или номер контрольного адресного столбца."
      - id: slot_preview
        type: "slot_preview"
        group: "options"
        span: "full"
        label: "Address line"
        label_ru: "Линейка адреса"
        default: "625000 · Уральский федеральный округ · Тюменская область · Тюменский муниципальный округ · г. Тюмень · ул. Ленина · д. 10"
        hint: "Read-only example of the address assembled from collected slot winners."
        hint_ru: "Read-only пример адреса, собранного из победителей по слотам."
      - id: enabled_slots
        type: "checkboxes"
        group: "options"
        span: "full"
        label: "Enabled slots"
        label_ru: "Включённые слоты"
        hint: "Checked slots participate in the generated address column and in output columns. Microdistrict/quartal is off by default."
        hint_ru: "Отмеченные слоты участвуют в генерируемой адресной колонке и выходных колонках. Микрорайон/квартал по умолчанию выключен."
        options:
          - value: "postal_index"
            label: "Postal index"
            label_ru: "Почтовый индекс"
            default: true
          - value: "federal_district"
            label: "Federal district"
            label_ru: "Федеральный округ"
            default: true
          - value: "parent_subject"
            label: "Parent subject"
            label_ru: "Регион-родитель"
            default: true
          - value: "subject"
            label: "Subject"
            label_ru: "Субъект РФ"
            default: true
          - value: "autonomous_okrug"
            label: "Autonomous okrug"
            label_ru: "Автономный округ"
            default: true
          - value: "municipality"
            label: "Municipality"
            label_ru: "Муниципалитет"
            default: true
          - value: "locality"
            label: "Locality"
            label_ru: "Населённый пункт"
            default: true
          - value: "territory"
            label: "Territory"
            label_ru: "Территория"
            default: true
          - value: "microdistrict"
            label: "Microdistrict"
            label_ru: "Микрорайон/квартал"
            default: false
          - value: "street"
            label: "Street"
            label_ru: "Улица"
            default: true
          - value: "house"
            label: "House"
            label_ru: "Дом"
            default: true
          - value: "premise"
            label: "Premise"
            label_ru: "Помещение"
            default: true
          - value: "oktmo_code"
            label: "OKTMO code"
            label_ru: "Код ОКТМО"
            default: true
          - value: "oktmo_name"
            label: "OKTMO name"
            label_ru: "Имя ОКТМО"
            default: true
          - value: "house_base"
            label: "House base"
            label_ru: "Номер дома"
            default: true
          - value: "house_mods"
            label: "House modifiers"
            label_ru: "Модификаторы дома"
            default: true
          - value: "house_modifiers"
            label: "House modifier columns"
            label_ru: "Колонки корпуса/строения"
            default: true
          - value: "street_numbers"
            label: "Street numbers"
            label_ru: "Номера в названии улицы"
            default: true
          - value: "territory_key"
            label: "Territory key"
            label_ru: "Ключ территории"
            default: true
          - value: "match_key"
            label: "Match key"
            label_ru: "Ключ сопоставления"
            default: true
      - id: slot_order
        type: "slot_order"
        group: "options"
        span: "full"
        label: "Slot order"
        label_ru: "Порядок слотов"
        hint: "Number dropdowns define the generated address line order. Disabled slots are ignored."
        hint_ru: "Dropdown с номерами задают порядок генерируемой адресной строки. Выключенные слоты игнорируются."
        default:
          postal_index: 1
          federal_district: 2
          parent_subject: 3
          subject: 4
          autonomous_okrug: 5
          municipality: 6
          locality: 7
          territory: 8
          microdistrict: 9
          street: 10
          house: 11
          premise: 12
        options:
          - value: "postal_index"
            label: "Postal index"
